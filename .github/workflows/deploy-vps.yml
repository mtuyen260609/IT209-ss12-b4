
name: Build and Deploy to VPS

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/it209-ss12-b4:latest

  deploy-vps:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - name: Deploy through SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            docker pull ghcr.io/${{ github.repository_owner }}/it209-ss12-b4:latest
            docker stop it209-ss12-b4 || true
            docker rm it209-ss12-b4 || true
            docker run -d --name it209-ss12-b4 --restart unless-stopped -p 8080:8080 ghcr.io/${{ github.repository_owner }}/it209-ss12-b4:latest
            sleep 5
            curl -f http://localhost:8080/actuator/health
